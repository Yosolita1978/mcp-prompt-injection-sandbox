# Run 2: Step 3 rule. Allowlist without draft_reply: the write tool is hidden and blocked.
# agentgateway v1.7.0. Same setup as ../../config.yaml, minus the UI.
# yaml-language-server: $schema=https://agentgateway.dev/schema/config

# Docs: https://agentgateway.dev/docs/standalone/latest/documentation/setup/install/docker/
config:
  database:
    url: sqlite:///gateway-data/data.db

# Docs: https://agentgateway.dev/docs/standalone/latest/documentation/quickstart/mcp/
gateways:
  default:
    port: 4000

# host.docker.internal = "the Mac running this container".
# Docs: https://docs.docker.com/desktop/features/networking/
mcp:
  policies:
    # Only these tools are allowed; draft_reply is not listed, so it is denied and hidden.
    # Docs: https://agentgateway.dev/docs/standalone/latest/documentation/configuration/security/mcp-authz/
    mcpAuthorization:
      rules:
      - 'mcp.tool.name == "search_leads"'
      - 'mcp.tool.name == "get_lead"'
  targets:
  - name: anzuelo-sandbox
    mcp:
      host: http://host.docker.internal:8000/mcp
